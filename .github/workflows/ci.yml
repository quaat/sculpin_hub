name: CI
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 verified immutable release; runs on node24 and installs pnpm 10.28.1
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env && pnpm env:smoke
      - run: pnpm prisma:format --check
      - run: pnpm prisma:validate
      - run: pnpm prisma:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  integration-and-containers:
    needs: validate
    env:
      POSTGRES_PASSWORD: ci-foundation-password
      DATABASE_URL: postgresql://sculpin:ci-foundation-password@127.0.0.1:5432/sculpin_hub
      SMOKE_NODE_ENV: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 verified immutable release; runs on node24 and installs pnpm 10.28.1
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: node scripts/check-ci-database-config.mjs
      - run: docker compose config --quiet
      - run: docker compose up -d --wait postgres redis
      - run: pnpm db:migrate:deploy
      - run: node scripts/run-db-integration.mjs --list-suites
      - run: pnpm db:migration:test
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: docker build -f apps/web/Dockerfile -t sculpin-hub-web .
      - run: docker build -f apps/proxy/Dockerfile -t sculpin-hub-proxy .
      - run: docker build -f apps/worker/Dockerfile -t sculpin-hub-worker .
      - run: ./scripts/container-smoke.sh
      - if: always()
        run: docker compose down --volumes
  browser-e2e:
    # S15 browser/control-plane E2E. The TEST-ONLY session seam is enabled ONLY
    # here (E2E_TEST_AUTH=1); NODE_ENV is never "production" in this job so the
    # config fail-closed guard is satisfied. Personas + catalogue/plan are seeded
    # by the Playwright global-setup via the REAL provisioning services.
    needs: validate
    env:
      NODE_ENV: test
      POSTGRES_PASSWORD: ci-foundation-password
      DATABASE_URL: postgresql://sculpin:ci-foundation-password@127.0.0.1:5432/sculpin_hub
      # TEST-ONLY auth seam (never enabled outside CI). Ephemeral values only.
      E2E_TEST_AUTH: "1"
      E2E_SESSION_SEED_KEY: ci-e2e-session-seed-key-not-a-real-secret-0123456789
      # Better Auth needs a signing secret + trusted origin to boot; the seam
      # never invokes a live OAuth provider, so the client ids/secrets are dummies.
      BETTER_AUTH_SECRET: ci-e2e-better-auth-secret-not-a-real-secret-0123456789
      BETTER_AUTH_URL: http://127.0.0.1:3210
      GOOGLE_CLIENT_ID: ci-e2e-google-client-id
      GOOGLE_CLIENT_SECRET: ci-e2e-google-client-secret
      GITHUB_CLIENT_ID: ci-e2e-github-client-id
      GITHUB_CLIENT_SECRET: ci-e2e-github-client-secret
      # The admin persona must be bootstrapped as platform admin for admin journeys.
      BOOTSTRAP_ADMIN_EMAILS: e2e-admin@example.test
      # PAT minting is exercised by the user journey; keyed HMAC secret (>=32 chars).
      PAT_HASH_SECRET: ci-e2e-pat-hash-secret-not-a-real-secret-0123456789
      PAT_HASH_KEY_VERSION: "1"
      # Sculpin discovery runs over the REAL adapter against a deterministic FAKE
      # upstream (apps/web/e2e/fake-sculpin.ts), started by Playwright on this
      # port. Both the fake server and the Next process share this ephemeral,
      # non-secret discovery credential. The test process also reads these to
      # assert they never leak into any client-visible surface.
      SCULPIN_FAKE_PORT: "3211"
      SCULPIN_UPSTREAM_URL: http://127.0.0.1:3211
      SCULPIN_DISCOVERY_API_KEY: ci-e2e-fake-discovery-key-not-a-real-secret
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 verified immutable release; runs on node24 and installs pnpm 10.28.1
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: docker compose up -d --wait postgres redis
      - run: pnpm db:migrate:deploy
      # Typecheck the browser suite with its dedicated tsconfig (excluded from the
      # Next app tsconfig so a normal build never requires @playwright/test).
      - run: pnpm --filter @sculpin/web exec playwright install --with-deps chromium
      - run: node node_modules/typescript/bin/tsc -p apps/web/e2e/tsconfig.json --noEmit
      - run: pnpm --filter @sculpin/web test:e2e:browser
      - if: always()
        run: docker compose down --volumes
